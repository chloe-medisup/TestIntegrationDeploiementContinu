name: exo3

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environnement à déployer
        required: true
        type: choice
        options: [staging, production]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: application
          path: dist/
          if-no-files-found: 'error'

  test:
    needs: build
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        node: [ 20, 22 ]
        os: [ ubuntu-26.04, windows-latest ]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: application
          path: dist/
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-26.04
    environment:
      name: ${{ inputs.target }}
      url: ${{ vars.API_URL }}

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: application
          path: dist/

      - name: Simuler le déploiement
        run: echo "Déploiement vers ${{ vars.API_URL }}

      - name: Produire le résumé
        shell: bash
        run: |
          echo "## Déploiement" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environnement : ${{ inputs.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL : ${{ vars.API_URL }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit : ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"