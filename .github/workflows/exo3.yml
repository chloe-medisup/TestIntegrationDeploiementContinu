name: exo3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - run: npm ci
      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm run build
      - run: |
          if [ ! -d dist ]; then
            echo "::error::Le dossier dist/ n'existe pas"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: application
          path: dist/
      - run: |
          echo "## Build" >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: build
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        node-version: [ 20, 22 ]
        os: [ ubuntu-26.04, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: application
          path: dist/
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-26.04
    environment: ${{ inputs.environment }}
    steps:
        - uses: actions/download-artifact@v7
          with:
            name: application
            path: dist/
        - run: echo "API_URL = ${{ vars.API_URL }}"
        - run: |
            echo "## Déploiement" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Cible :** ${{ inputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **URL :** ${{ vars.API_URL }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Commit :** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"